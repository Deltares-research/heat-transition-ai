[project]
name = "heat-transition-ai"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "azure-storage-blob>=12.31.1",
    "bs4>=0.0.2",
    "duckdb>=1.5.5",
    "fastapi>=0.121.0",
    "jinja2>=3.1.6",
    "litellm>=1.94.0",
    "markdown>=3.11.3",
    "mcp>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-ai>=2.31.1",
    "pymupdf>=1.28.0",
    "pymupdf4llm>=1.28.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tqdm>=4.70.0",
    "trafilatura>=2.1.0",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
heat-cli = "apps.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The project's library code lives under src/ and every internal import is
# already written as `from src.xxx import ...`, so packaging src/ itself as
# the top-level module (rather than renaming to heat_transition_ai) means
# zero import changes there. apps/ holds the entry-point packages (cli, api,
# mcp) that consume src/ but nothing in src/ depends on them.
packages = ["src", "apps"]
