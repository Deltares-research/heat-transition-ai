# Warmteprogramma extraction questions.
#
# type: split  = {woningen, utiliteit} counts
#       count  = single integer
#       bool   = true / false
#       enum   = one value from `values:`
#       status = gepland | in_onderzoek | expliciet_uitgesloten | niet_vermeld
#       text   = free text, quoted from source
#
# EVERY answer carries, at schema level (not per question):
#   value, modality, source_sha, page, span, quote
#
# modality: vastgesteld | voornemen | verkenning | expliciet_geen | onduidelijk | niet_vermeld
#
# Answer niet_vermeld when the document is silent. Never 0.
# `expliciet_geen` (the document demonstrably says no) is NOT the same as
# `niet_vermeld` (the document does not address it). Keep them distinct.

# ─────────────────────────────────────────────────────────────
# A · Document metadata  (NEW — needed for versioning, clustering, caveats)
# ─────────────────────────────────────────────────────────────

- id: doc_status
  type: enum
  values: [vastgesteld, ontwerp, concept, onbekend]
  nl: Wat is de status van dit programma?
  en: What is the adoption status of this programme?

- id: doc_datum
  type: text
  nl: Wat is de vaststellings- of publicatiedatum?
  en: Adoption or publication date?

- id: doc_periode
  type: text
  nl: Op welke periode heeft het programma betrekking (bv. 2026-2035)?
  en: What period does the programme cover?

- id: adviesbureau
  type: text
  nl: Welk adviesbureau is genoemd in de colofon of als opsteller?
  en: Which consultancy is named in the colophon or as author?

- id: samenwerkingsverband
  type: text
  nl: Is het programma opgesteld in een regionaal of ambtelijk samenwerkingsverband?
  en: Was it produced within a regional or shared-services partnership?

- id: vervangt_tvw
  type: bool
  nl: Vervangt dit programma een eerdere Transitievisie Warmte, en welke?
  en: Does this supersede an earlier Transitievisie Warmte, and which?

# ─────────────────────────────────────────────────────────────
# B · Scope and quantities  (existing)
# ─────────────────────────────────────────────────────────────

- id: gebouwen_totaal
  type: split
  nl: Hoeveel gebouwen telt de gemeente in totaal?
  en: Total number of buildings in the municipality?

- id: niet_aardgasvrij
  type: split
  nl: Hoeveel gebouwen zijn nog niet aardgasvrij?
  en: How many buildings are not yet natural-gas-free?

- id: gepland_collectief
  type: split
  nl: Hoeveel gebouwen zijn gepland voor een collectieve warmte-oplossing?
  en: How many buildings are planned for a collective heating solution?

- id: gepland_individueel
  type: split
  nl: Hoeveel gebouwen zijn gepland voor een individuele oplossing (all-electric)?
  en: How many buildings are planned for an individual solution (all-electric)?

- id: isolatieopgave
  type: split
  nl: Voor hoeveel gebouwen geldt een isolatie-opgave?
  en: How many buildings have an insulation requirement?

- id: isolatie_standaard
  type: text
  nl: Welke isolatiestandaard of streefwaarde wordt gehanteerd?
  en: Which insulation standard or target value is applied?

# ─────────────────────────────────────────────────────────────
# C · Techniques  (RESTRUCTURED — status first, count second)
#
# Enqualia found 38/40 programmes do not quantify per technique, so a
# pure count question returns null almost everywhere and throws away the
# informative signal. Ask status first; the count is a bonus when present.
# ─────────────────────────────────────────────────────────────

- id: warmtenet_ht_mt_status
  type: status
  nl: Wordt een warmtenet op hoge/middentemperatuur (HT/MT) gepland, onderzocht of uitgesloten?
  en: Is an HT/MT heat network planned, under investigation, or excluded?

- id: warmtenet_ht_mt_aantal
  type: split
  nl: Hoeveel gebouwen komen op een warmtenet op hoge/middentemperatuur?
  en: How many buildings connect to an HT/MT heat network?

- id: warmtenet_lt_zlt_status
  type: status
  nl: Wordt een warmtenet op lage/zeer lage temperatuur (LT/ZLT) gepland, onderzocht of uitgesloten?
  en: Is an LT/VLT heat network planned, under investigation, or excluded?

- id: warmtenet_lt_zlt_aantal
  type: split
  nl: Hoeveel gebouwen komen op een warmtenet op lage/zeer lage temperatuur?
  en: How many buildings connect to an LT/VLT heat network?

- id: geothermie_status
  type: status
  nl: Wordt geothermie gepland, onderzocht of uitgesloten?
  en: Is geothermal energy planned, under investigation, or excluded?

- id: geothermie_aantal
  type: split
  nl: Hoeveel gebouwen worden voorzien via geothermie?
  en: How many buildings are supplied by geothermal energy?

- id: aquathermie_status
  type: status
  nl: Wordt aquathermie (TEO/TEA/TED) gepland, onderzocht of uitgesloten?
  en: Is aquathermal energy planned, under investigation, or excluded?

- id: restwarmte_status
  type: status
  nl: Wordt restwarmte (industrie, datacenter) als bron genoemd?
  en: Is waste heat named as a source?

- id: groen_gas_status
  type: status
  nl: Wordt groen gas gepland, onderzocht of uitgesloten?
  en: Is green gas planned, under investigation, or excluded?

- id: waterstof_status
  type: status
  nl: Wordt waterstof gepland, onderzocht of uitgesloten?
  en: Is hydrogen planned, under investigation, or excluded?

- id: hybride_warmtepomp
  type: status
  nl: Wordt de hybride warmtepomp als (tussen)oplossing genoemd?
  en: Is the hybrid heat pump named as a (transitional) solution?

- id: gasnet_behoud
  type: text
  nl: Wordt uitgesproken dat het gasnet (deels) in stand blijft, en tot wanneer?
  en: Is it stated that the gas network (partly) remains, and until when?

# ─────────────────────────────────────────────────────────────
# D · Reasons  (NEW — the Central Government's headline question)
# ─────────────────────────────────────────────────────────────

- id: warmtenet_afwijzing_reden
  type: enum
  values:
    - geen_bron_beschikbaar
    - businesscase_negatief
    - netcapaciteit
    - te_lage_bebouwingsdichtheid
    - bestuurlijke_keuze
    - niet_onderzocht
    - nvt
  nl: Als collectieve oplossingen zijn afgewezen of afgeschaald, wat is de opgegeven reden?
  en: If collective solutions were rejected or scaled back, what reason is given?

- id: bron_beschikbaarheid
  type: text
  nl: Welke warmtebronnen zijn in of nabij de gemeente beschikbaar volgens het programma?
  en: Which heat sources does the programme identify as available in or near the municipality?

- id: knelpunten
  type: enum
  values:
    - capaciteit_personeel
    - financiering
    - netcongestie
    - draagvlak
    - warmtebron
    - wetgeving_onzeker
    - marktpartijen
    - geen_genoemd
  nl: Welke knelpunten worden genoemd voor de haalbaarheid?
  en: Which bottlenecks are cited regarding feasibility?

- id: ondersteuningsbehoefte
  type: text
  nl: Welke ondersteuning vraagt de gemeente van Rijk, provincie of NPLW?
  en: What support does the municipality request from national, provincial or NPLW level?

# ─────────────────────────────────────────────────────────────
# E · Timing  (NEW — nothing in the original list captured dates)
# ─────────────────────────────────────────────────────────────

- id: startgebieden_aantal
  type: count
  nl: Hoeveel startgebieden of eerste uitvoeringsgebieden zijn aangewezen?
  en: How many start areas or first implementation areas are designated?

- id: eerste_gebied_jaar
  type: text
  nl: In welk jaar gaat het eerste gebied van het aardgas af?
  en: In which year does the first area go off natural gas?

- id: doeljaar_2030
  type: text
  nl: Wat is de doelstelling voor 2030 (aantal woningen, gebieden of percentage)?
  en: What is the 2030 target (dwellings, areas or percentage)?

- id: doeljaar_2050
  type: bool
  nl: Wordt 2050 als eindjaar voor aardgasvrij bevestigd of afgezwakt?
  en: Is 2050 confirmed or qualified as the end date for gas-free?

- id: uitvoeringsjaren_per_gebied
  type: bool
  nl: Zijn per gebied concrete uitvoeringsjaren of -periodes opgenomen?
  en: Are concrete implementation years given per area?

# ─────────────────────────────────────────────────────────────
# F · Instruments and governance  (existing + additions)
# ─────────────────────────────────────────────────────────────

- id: gebiedsindeling
  type: count
  nl: Is er een gebiedsindeling gemaakt, en zo ja, hoeveel gebieden?
  en: Is there a zoning of the municipality, and if so, how many zones?

- id: gebiedsindeling_categorieen
  type: text
  nl: Welke categorieën gebruikt de gebiedsindeling (bv. kansrijk, verkenningsgebied)?
  en: Which categories does the zoning use?

- id: aanwijsbevoegdheid
  type: count
  nl: In hoeveel gebieden wordt de aanwijsbevoegdheid ingezet of voorgenomen?
  en: In how many zones are designation powers used or planned?

- id: aanwijsbevoegdheid_toelichting
  type: text
  nl: Hoe motiveert de gemeente het wel of niet inzetten van de aanwijsbevoegdheid?
  en: How does the municipality justify using or not using designation powers?

- id: publiek_warmtebedrijf
  type: text
  nl: Is er een publiek warmtebedrijf, bestaand of in oprichting?
  en: Is there a public heat utility, existing or being established?

- id: warmtegemeenschappen
  type: count
  nl: Zijn er lokale warmtegemeenschappen, en zo ja, hoeveel?
  en: Are there local heat communities, and if so, how many?

- id: woningcorporaties
  type: text
  nl: Welke rol krijgen woningcorporaties, en zijn er prestatieafspraken genoemd?
  en: What role do housing corporations play, and are performance agreements named?

- id: netbeheerder_afstemming
  type: text
  nl: Is afstemming met de netbeheerder beschreven, en wordt netcongestie genoemd?
  en: Is coordination with the grid operator described, and is congestion named?

- id: monitoring
  type: bool
  nl: Zijn monitoring- of evaluatieafspraken opgenomen, en met welke frequentie?
  en: Are monitoring or evaluation arrangements included, and at what interval?

# ─────────────────────────────────────────────────────────────
# G · Environmental assessment  (existing)
# ─────────────────────────────────────────────────────────────

- id: mer_beoordeling
  type: bool
  nl: Is er een m.e.r.-beoordeling als eerste toets uitgevoerd?
  en: Was an initial SEA screening carried out?

- id: plan_mer_plicht
  type: bool
  nl: Is er sprake van een plan-m.e.r.-plicht?
  en: Is a formal Plan-SEA mandatory?

- id: plan_mer_opgesteld
  type: bool
  nl: Is er een plan-MER opgesteld?
  en: Has a Plan-SEA report been prepared?

# ─────────────────────────────────────────────────────────────
# H · Execution and finance  (existing)
# ─────────────────────────────────────────────────────────────

- id: uitvoeringsparagraaf
  type: bool
  nl: Is er een uitvoeringsparagraaf opgenomen of als apart document bijgevoegd?
  en: Is an implementation section included or attached separately?

- id: fte_raming
  type: text
  nl: Is er een raming van benodigde FTE's, en wordt een knelpunt benoemd?
  en: Is there an FTE estimate, and is a bottleneck flagged?

- id: investeringskosten
  type: text
  nl: Is er een raming van de benodigde investeringskosten?
  en: Is there an estimate of required investment costs?

- id: financiele_dekking
  type: text
  nl: Is de wijze van financiële dekking van deze middelen vermeld?
  en: Is the method of financing these resources described?

- id: participatie
  type: text
  nl: Hoe is participatie van bewoners en bedrijven ingevuld?
  en: How was participation of residents and businesses implemented?