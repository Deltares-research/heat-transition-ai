server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # api and webapp run in the same container (same Azure Container App), so
    # the backend is always reachable on loopback — no service discovery needed.
    location /ask {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
