server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the /ask and /health proxy rules from webapp/vite.config.js.
    # Override BACKEND_HOST via `docker run -e` + envsubst, or edit directly.
    location /ask {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
